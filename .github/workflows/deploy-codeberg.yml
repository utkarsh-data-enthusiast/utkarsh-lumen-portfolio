
name: Deploy Lumen Portfolio to Codeberg

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumen-codeberg-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Lumen Portfolio
    runs-on: ubuntu-latest

    steps:
      - name: Check out website source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build website
        shell: bash
        run: |
          set -euo pipefail

          python3 build.py

          test -f dist/index.html
          test -f dist/404.html
          test -f dist/privacy.html
          test -f dist/projects/index.html
          test -f dist/assets/style.css
          test -f dist/assets/app.js
          test -f dist/assets/icon.svg

          echo "Website build successful."

      - name: Synchronize and publish to Codeberg
        shell: bash
        env:
          CODEBERG_DEPLOY_TOKEN: ${{ secrets.CODEBERG_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${CODEBERG_DEPLOY_TOKEN}" ]]; then
            echo "Missing Codeberg deployment credential."
            exit 1
          fi

          CODEBERG_REPO="https://codeberg.org/utkarsh-data-enthusiast/utkarsh-lumen-portfolio.git"

          # Authenticate securely without putting the token in Git URLs.
          ASKPASS_FILE="$(mktemp)"

          cleanup() {
            rm -f "$ASKPASS_FILE"
          }

          trap cleanup EXIT

          cat > "$ASKPASS_FILE" <<'SCRIPT'
          #!/usr/bin/env bash
          case "$1" in
            *Username*)
              printf '%s\n' "utkarsh-data-enthusiast"
              ;;
            *Password*)
              printf '%s\n' "$CODEBERG_DEPLOY_TOKEN"
              ;;
            *)
              exit 1
              ;;
          esac
          SCRIPT

          chmod 700 "$ASKPASS_FILE"

          export GIT_ASKPASS="$ASKPASS_FILE"
          export GIT_TERMINAL_PROMPT=0

          # Synchronize Codeberg's main branch with GitHub.
          git push \
            "$CODEBERG_REPO" \
            HEAD:refs/heads/main

          # Download the currently published Codeberg Pages branch.
          git clone \
            --depth 1 \
            --single-branch \
            --branch pages \
            "$CODEBERG_REPO" \
            .deploy-pages

          # Copy generated website files.
          # Preserve Git metadata and repository documentation.
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.domains' \
            --exclude='README.md' \
            --exclude='LICENSE' \
            --exclude='SECURITY.md' \
            dist/ .deploy-pages/

          git -C .deploy-pages config \
            user.name "Lumen Deployment Bot"

          git -C .deploy-pages config \
            user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git -C .deploy-pages add -A

          # Publish only if the generated website has changed.
          if git -C .deploy-pages diff --cached --quiet; then
            echo "Codeberg Pages is already up to date."
          else
            git -C .deploy-pages commit \
              -m "Deploy Lumen Portfolio from GitHub Actions"

            git -C .deploy-pages push \
              origin HEAD:refs/heads/pages

            echo "Website files pushed to Codeberg Pages."
          fi
